[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-mcp"
version = "2.1.6"
description = "MCP server for interacting with Obsidian vaults through direct filesystem access"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Nate Strong", email = "nathanstrong.fx@gmail.com"}
]
keywords = ["mcp", "obsidian", "fastmcp", "llm", "ai", "notes", "knowledge-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp==2.12.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "pyyaml>=6.0.0",
    "pillow>=10.0.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.6.0",
    "pyright>=1.1.400",
]

[project.urls]
Homepage = "https://github.com/natestrong/obsidian-mcp"
Repository = "https://github.com/natestrong/obsidian-mcp"
Issues = "https://github.com/natestrong/obsidian-mcp/issues"

[project.scripts]
obsidian-mcp = "obsidian_mcp.server:main"
obsidian-mcp-configure = "obsidian_mcp.configure:main"

[tool.setuptools]
packages = ["obsidian_mcp", "obsidian_mcp.tools", "obsidian_mcp.utils", "obsidian_mcp.models"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pyright]
include = ["obsidian_mcp", "tests"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "graphify-out",
]
# Lowest interpreter the package claims to support, so 3.11+-only syntax is caught.
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
# "standard" is pyright's default and the right level for this tree: it catches
# the Optional-access and argument-type bugs that matter here without demanding
# full annotation coverage. The tree currently reports ~133 findings, so the
# gates (Stop hook, CI) check only the files a change actually touches rather
# than failing on inherited debt. Tighten to "strict" once the backlog clears.
typeCheckingMode = "standard"